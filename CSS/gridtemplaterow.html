<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grid template row</title>
    <style>
      .container {
        background-color: rgb(179, 233, 233);
        width: 80%;
        display: grid;
        grid-template-rows: 300px 300px;
      }
      .container > :nth-child(1) {
        padding: 20px;
        background-color: aqua;
      }
      .container > :nth-child(2) {
        padding: 20px;
        background-color: blue;
      }

      .container > :nth-child(3) {
        padding: 20px;
        background-color: rgb(14, 106, 106);
      }

      .container > :nth-child(4) {
        padding: 20px;
        background-color: rgb(28, 192, 99);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <p>p1</p>
      <p>p2</p>
      <p>p3</p>
      <p>p4</p>
    </div>
  </body>
</html>
