<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bookmark Landing Page</title>
    <link rel="stylesheet" href="./css/output.css" />
  </head>
  <body>
    <div class="flex flex-col justify-center">
      <nav class="flex justify-between mt-4">
        <!-- logo section -->
        <div>
          <img src="./images/logo-bookmark.svg" alt="logo" />
        </div>
        <!-- features section -->
        <div class="flex justify-around w-2/3 uppercase text-grayishBlue">
          <h3>Features</h3>
          <h3>Pricing</h3>
          <h3>Contact</h3>
          <button class="bg-softRed text-white px-2 rounded-lg h-10">Login</button>
        </div>
      </nav>
      <!-- Image container -->
      <section class="flex justify-between items-center mt-4 p-10 ">
        <div class="content-container w-2/3 text-lg">
          <h3 class="text-center font-sans font-bold text-2xl">

            A simple Bookmark Manager</h3>
          </h3>
          <p>
            A clean and simple interface to organize your favourite websites.
            Open a new browser tab and see your sites load instantly. Try it for
            free.
          </p>
          <div class="button-container flex justify-center items-center">
            <button class="bg-softBlue w-40 rounded-lg mr-4  h-10">
              Get it on Chrome
            </button>
            <button class="bg-grayishBlue w-40 rounded-lg mr-4  h-10">
              Get it on Firefox
            </button>
          </div>
        </div>

        <div>
          <img src="./images/illustration-hero.svg" alt="hero image" />
        </div>
      </section>
    </div>
  </body>
</html>
