<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Transition</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <button
      class="bg-blue-500 text-white p-3 transition duration-300 ease-in hover:bg-red-500"
    >
      Button A
    </button>

    <button
      class="bg-blue-500 text-white p-3 transition duration-300 ease-out hover:scale-125"
    >
      Button B
    </button>
  </body>
</html>
