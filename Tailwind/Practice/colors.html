<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tailwind colors</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <!-- font colors -->
    <p class="text-red-50">Tailwind</p>
    <p class="text-red-100">Tailwind</p>
    <p class="text-red-200">Tailwind</p>
    <p class="text-red-300">Tailwind</p>
    <p class="text-red-400">Tailwind</p>
    <p class="text-red-500">Tailwind</p>
    <p class="text-red-600">Tailwind</p>
    <p class="text-red-700">Tailwind</p>
    <p class="text-red-800">Tailwind</p>
    <p class="text-red-900">Tailwind</p>

    <!-- background color -->
    <p class="text-white bg-slate-600">Background</p>
    <p class="text-white bg-zinc-500">Background</p>

    <!-- underline -->
    <p class="underline decoration-red-400">Tailwind</p>

    <!-- Border colors -->
    <p class="border-2 border-red-500">Tailwind</p>

    <!-- outline colors -->
    <p class="outline outer-blue-400">Tailwind</p>
    <!-- shadow -->
    <button class="bg-cyan-500 shadow-lg shadow-cyan-800">click</button>

    <p class="bg-[#594715] text-[#f2e9d0]">Hello</p>
  </body>
</html>
