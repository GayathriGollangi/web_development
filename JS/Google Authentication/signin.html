<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In</title>
  </head>
  <body>
    <h2>Sign In</h2>

    <button type="button" id="signin">Sign In</button>
    <button type="button" id="logout" style="display: none">logout</button>
  </body>
</html>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js";
  const firebaseConfig = {
    apiKey: "AIzaSyCLWrDXsScjIScXox9_zw67JcxIyvs1JCQ",
    authDomain: "web-authentication-2096e.firebaseapp.com",
    projectId: "web-authentication-2096e",
    storageBucket: "web-authentication-2096e.firebasestorage.app",
    messagingSenderId: "633580117495",
    appId: "1:633580117495:web:69fc04f26c239ecd4862f2",
  };

  // Initialize Firebase
  const app = initializeApp(firebaseConfig);

  import {
    getAuth,
    signInWithPopup,
    GoogleAuthProvider,
    signOut,
  } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-auth.js";

  const auth = getAuth(app);
  const provider = new GoogleAuthProvider();
  document.getElementById("signin").addEventListener("click", function () {
    document.getElementById("logout").style.display = "block";
    signInWithPopup(auth, provider)
      .then((result) => {
        // This gives you a Google Access Token. You can use it to access the Google API.
        const credential = GoogleAuthProvider.credentialFromResult(result);
        const token = credential.accessToken;
        // The signed-in user info.
        const user = result.user;
        // IdP data available using getAdditionalUserInfo(result)
        // ...
        console.log(user);
        alert("registered");
      })
      .catch((error) => {
        // Handle Errors here.
        const errorCode = error.code;
        const errorMessage = error.message;
        // The email of the user's account used.
        const email = error.customData.email;
        // The AuthCredential type that was used.
        const credential = GoogleAuthProvider.credentialFromError(error);
        // ...
      });
  });

  document.getElementById("logout").addEventListener("click", function () {
    signOut(auth)
      .then(() => {
        // Sign-out successful.
        alert("logout success");
      })
      .catch((error) => {
        // An error happened.
        alert("logout failed");
      });
  });
</script>
