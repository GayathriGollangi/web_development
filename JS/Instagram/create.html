<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Post</title>
    <link rel="stylesheet" href="./create.css" />
  </head>
  <body>
    <h1 class="page-title">Manage Posts</h1>

    <div class="container">
      <div id="post_container" class="card">
        <h2>Create Post</h2>

        <label for="title">Title</label>
        <input type="text" id="title" placeholder="Enter title" />

        <label for="image">Image</label>
        <input type="file" id="image" accept="image/*" />

        <button id="submit_btn" type="button" onclick="getData()">
          Submit
        </button>
      </div>

      <div id="patch_container" class="card">
        <h2>Patch Update</h2>

        <label for="patch_id">Post ID</label>
        <input type="text" id="patch_id" placeholder="Enter ID to update" />

        <label for="patch_title">Title</label>
        <input type="text" id="patch_title" placeholder="Enter title" />

        <button type="button" onclick="getPatchData()">Patch Update</button>
      </div>

      <div id="put_container" class="card">
        <h2>Put Update</h2>

        <label for="put_title">Post ID</label>
        <input type="text" id="put_id" placeholder="Enter ID to update" />
        <label for="put_title">Title</label>
        <input type="text" id="put_title" placeholder="Enter title" />

        <button type="button" onclick="updateData()">Put</button>
      </div>

      <div id="delete_container" class="card">
        <h2>Delete Post</h2>

        <label for="delete_id">Post ID</label>
        <input type="text" id="delete_id" placeholder="Enter ID to delete" />

        <button type="button" onclick="deleteData()">Delete</button>
      </div>

      <div>
        <a href="./index.html"><button>Home</button></a>
      </div>
    </div>

    <script src="./create.js"></script>
  </body>
</html>
