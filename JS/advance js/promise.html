<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>promise</title>
  </head>
  <body></body>
</html>
<script>
  let promise = new Promise((resolve, reject) => {
    setTimeout(() => {
      reject("no data");
    });
  });

  console.log(promise);

  promise
    .then((resolve) => {
      console.log(resolve);
    })
    .catch((reject) => {
      console.log(reject);
    });
  setTimeout(() => {
    console.log(promise);
  });
</script>
