<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>calculator</title>
    <style>
      #calculator {
        font-size: 25px;
        text-align: center;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }
      #display {
        box-shadow: rgba(100, 100, 111, 0.2) 0px 7px 29px 0px;
        width: 40%;
        height: 50px;
      }
      #keyboard {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        width: 50%;
        text-align: center;
      }
      #keyboard > div {
        width: 50px;
        height: 50px;
        /* box-shadow: rgba(0, 0, 0, 0.15) 1.95px 1.95px 2.6px; */
        box-shadow: rgba(0, 0, 0, 0.1) 0px 4px 12px;
        margin: 10px;
        padding: 5px;
      }
      #keyboard > div:hover {
        background-color: teal;
        color: white;
      }
      .black {
        background-color: black;
        color: white;
      }
      .red {
        background-color: red;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <section id="calculator">
      <h1>calculator</h1>
      <div id="display"></div>
      <div id="keyboard">
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div class="black">+</div>
        <div>4</div>
        <div>5</div>
        <div>6</div>
        <div class="black">-</div>
        <div>7</div>
        <div>8</div>
        <div>9</div>
        <div class="black">*</div>
        <div class="red">AC</div>
        <div>0</div>
        <div class="black">=</div>
        <div class="black">/</div>
      </div>
    </section>
  </body>
</html>
<script>
  // Select all calculator buttons
  let keys = document.querySelectorAll("#keyboard>div");

  // Stores the entered numbers and operators
  let bag = "";

  // Add click event listener to every calculator button
  for (let i = 0; i < keys.length; i++) {
    keys[i].addEventListener("click", calculator);
  }

  // Function to perform calculator operations
  function calculator() {
    // Get the clicked button value
    let num = event.target.innerText;
    console.log(num);

    // Clear the display and reset the stored expression
    if (num === "AC") {
      bag = "";
      document.querySelector("#display").innerText = bag;

      // Evaluate the expression when equals button is clicked
    } else if (num === "=") {
      document.querySelector("#display").innerText = eval(bag);

      // Append the clicked number or operator to the expression
    } else {
      bag = bag + num;
      document.querySelector("#display").innerText = bag;
    }
  }
</script>
