<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1 id="count">0</h1>
    <button onclick="likeButton()">like</button>
    <button onclick="unlikeButton()">unlike</button>
  </body>
</html>
<script>
  let likes = 0;
  function likeButton() {
    likes++;
    document.getElementById("count").innerText = likes;
  }
  function unlikeButton() {
    likes--;
    document.getElementById("count").innerText = likes;
  }
</script>
