<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bookmarks</title>
  </head>
  <body>
    <!-- navbar -->
    <nav>
      <div><a href="./home.html">Home</a></div>
      <div><a href="./application.html">Applied jobs</a></div>
      <div><a href="./bookmarks.html">bookmarks</a></div>
    </nav>

    <table border="1">
      <thead>
        <tr>
          <th>Person Name</th>
          <th>Person Email</th>
          <th>Person Role</th>
          <th>Person salary</th>
          <th>Delete</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </body>
</html>
<script>
  let data = JSON.parse(localStorage.getItem("bookmarks")) || [];

  let body = document.querySelector("body");

  data.forEach((element, index) => {
    let tr = document.createElement("tr");

    let td1 = document.createElement("td");
    td1.innerText = element.personName;

    let td2 = document.createElement("td");
    td2.innerText = element.personEmail;

    let td3 = document.createElement("td");
    td3.innerText = element.personRole;

    let td4 = document.createElement("td");
    td4.innerText = element.personSalary;

    let td5 = document.createElement("td");
    td5.innerText = "Delete";

    td5.addEventListener("click", function () {
      deleteBookmark(element, index);
    });

    tr.append(td1, td2, td3, td4, td5);

    document.querySelector("tbody").append(tr);
  });
  // Delete bookmark
  function deleteBookmark(element, index) {
    console.log("Bookmark deleted");
    //deleting the data
    data.splice(index, 1);
    //updating the localstorage
    localStorage.setItem("bookmarks", JSON.stringify(data));
    //reload the page to get new data
    window.location.reload();
  }
</script>
