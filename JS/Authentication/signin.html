<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SignIn</title>
  </head>
  <body>
    <form>
      <label for="email">Enter your email:</label>

      <input
        type="login_email"
        id="login_email"
        pattern=".+@example\.com"
        size="30"
        required
      /><br />

      <label for="login_password">Password</label>
      <input type="password" id="login_password" minlength="6" required />

      <button id="signin" type="button">Signin</button>
    </form>
  </body>
</html>
<script type="module">
  // Import the functions you need from the SDKs you need
  import { initializeApp } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js";

  import {
    getAuth,
    signInWithEmailAndPassword,
  } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-auth.js";

  import {
    getDatabase,
    ref,
    onValue,
  } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCLWrDXsScjIScXox9_zw67JcxIyvs1JCQ",
    authDomain: "web-authentication-2096e.firebaseapp.com",
    projectId: "web-authentication-2096e",
    storageBucket: "web-authentication-2096e.firebasestorage.app",
    messagingSenderId: "633580117495",
    appId: "1:633580117495:web:69fc04f26c239ecd4862f2",
  };

  // Initialize Firebase
  const app = initializeApp(firebaseConfig);

  // starts ...

  const auth = getAuth(app);
  const db = getDatabase();

  document.getElementById("signin").addEventListener("click", function () {
    let email = document.getElementById("login_email").value;
    let password = document.getElementById("login_password").value;

    signInWithEmailAndPassword(auth, email, password)
      .then((userCredential) => {
        // Signed in
        const user = userCredential.user;
        // ...
        const user_ref = ref(db, "users/" + user.uid);
        onValue(user_ref, (snapshot) => {
          const data = snapshot.val();
          console.log(data);
        });
        alert("logged successfully");
        console.log(user);
      })
      .catch((error) => {
        const errorCode = error.code;
        const errorMessage = error.message;
        alert(errorMessage);
      });
  });
</script>
